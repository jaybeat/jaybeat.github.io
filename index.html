<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林小川</title>
  <meta name="description" content="林小川的个人网站：经历、项目与作品集">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 尽早应用主题，避免闪烁
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- 导航栏 -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="#top" id="navLogo"></a>
      <nav class="nav-links" id="navLinks">
        <a href="#about">关于</a>
        <a href="#experience">经历</a>
        <a href="#projects">项目</a>
        <a href="#portfolio">作品集</a>
        <a href="#contact">联系</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" aria-label="切换深浅色">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menuToggle" aria-label="菜单" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <p class="hero-eyebrow reveal" id="heroEyebrow"></p>
      <h1 class="hero-title reveal" id="heroName"></h1>
      <p class="hero-tagline reveal" id="heroTagline"></p>
      <div class="hero-cta reveal">
        <a class="btn btn-primary" href="#about">了解我</a>
        <a class="link-arrow" href="#portfolio">看作品</a>
      </div>
    </section>

    <!-- 关于我 -->
    <section class="section section-alt" id="about">
      <div class="container">
        <h2 class="section-title reveal">关于我</h2>
        <div class="about reveal">
          <div class="avatar" id="avatar"></div>
          <div class="about-text">
            <h3 class="about-name" id="aboutName"></h3>
            <p class="about-meta" id="aboutMeta"></p>
            <p class="about-bio" id="aboutBio"></p>
          </div>
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </section>

    <!-- 经历 -->
    <section class="section" id="experience">
      <div class="container narrow">
        <h2 class="section-title reveal">我的经历</h2>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- 项目 -->
    <section class="section section-alt" id="projects">
      <div class="container">
        <h2 class="section-title reveal">我的项目</h2>
        <div class="bento" id="bento"></div>
      </div>
    </section>

    <!-- 作品集 -->
    <section class="section" id="portfolio">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title reveal">作品集</h2>
          <div class="gallery-controls">
            <button class="round-btn" id="galleryPrev" aria-label="上一个">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <button class="round-btn" id="galleryNext" aria-label="下一个">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- 联系 -->
    <section class="section section-alt contact" id="contact">
      <div class="container narrow">
        <h2 class="contact-title reveal" id="contactTitle"></h2>
        <p class="contact-sub reveal" id="contactSub"></p>
        <div class="contact-links reveal" id="contactLinks"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p id="footerText"></p>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" data-close></div>
    <div class="lightbox-panel" role="dialog" aria-modal="true">
      <button class="round-btn lightbox-close" data-close aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="lightbox-media" id="lbMedia"></div>
      <div class="lightbox-body">
        <p class="card-eyebrow" id="lbCategory"></p>
        <h3 id="lbTitle"></h3>
        <p id="lbDesc"></p>
        <a class="link-arrow" id="lbLink" target="_blank" rel="noopener">查看详情</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
